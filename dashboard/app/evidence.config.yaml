# FanSphere AI — Evidence theme
# v1.1 locked palette: "Crimson on Charcoal" (monochrome).
# Decorative colour = crimson + slate only. Red/green are reserved STRICTLY for
# sentiment semantics (negative/positive). No amber, violet, cyan, or blue.

appearance:
  default: dark
  switcher: true

theme:
  colorPalettes:
    default:
      light:
        - "#A50044"   # crimson
        - "#7C8DA0"   # slate
        - "#D17BA0"   # muted crimson
        - "#475569"   # deep slate
      dark:
        - "#E11D5C"   # crimson
        - "#94A3B8"   # slate
        - "#FF6B9D"   # bright crimson
        - "#64748B"   # muted slate
    rivalry:
      light:
        - "#A50044"   # rivalry = crimson
        - "#7C8DA0"   # non-rivalry = slate
      dark:
        - "#E11D5C"
        - "#94A3B8"
    segment:          # cohort intensity ramp: Casual → Tactical → Highly Engaged → Ultra
      light:
        - "#7C8DA0"
        - "#BC5378"
        - "#A50044"
        - "#E0608C"
      dark:
        - "#94A3B8"
        - "#BC5378"
        - "#E11D5C"
        - "#FF6B9D"
  colorScales:
    sentiment:        # semantic only: negative → neutral → positive
      light:
        - "#EF4444"
        - "#F1F5F9"
        - "#22C55E"
      dark:
        - "#EF4444"
        - "#1E293B"
        - "#22C55E"
    engagement:       # slate → crimson intensity
      light:
        - "#F1F5F9"
        - "#A50044"
      dark:
        - "#1E293B"
        - "#E11D5C"
    default:
      light:
        - "#F1F5F9"
        - "#A50044"
      dark:
        - "#1E293B"
        - "#E11D5C"
  colors:
    primary:
      light: "#A50044"
      dark: "#E11D5C"
    accent:           # light crimson (was amber)
      light: "#D17BA0"
      dark: "#FF6B9D"
    base:
      light: "#FFFFFF"
      dark: "#0E1117"
    info:             # neutral slate (was blue) — keeps info callouts on-palette
      light: "#7C8DA0"
      dark: "#94A3B8"
    positive:         # sentiment semantic
      light: "#16A34A"
      dark: "#22C55E"
    negative:         # sentiment semantic
      light: "#DC2626"
      dark: "#EF4444"
    warning:          # crimson (was amber/brown)
      light: "#A50044"
      dark: "#E11D5C"

plugins:
  components:
    "@evidence-dev/core-components": {}
  datasources:
    "@evidence-dev/duckdb": {}
    "@evidence-dev/csv": {}

deployment:
  basePath: "/FanSphere-AI"
